name: Owner serial transport
on:
  push:
    branches: [codex/meg93-owner-serial-transport]
    paths:
      - ops/owner-serial-transport.mjs
      - ops/owner-serial-transport.test.mjs
      - ops/assert-reels-alignment-closed.py
      - ops/test_reels_alignment_closed.py
      - .github/workflows/reels-owner-transport.yml
  pull_request:
    paths:
      - ops/owner-serial-transport.mjs
      - ops/owner-serial-transport.test.mjs
      - ops/assert-reels-alignment-closed.py
      - ops/test_reels_alignment_closed.py
      - .github/workflows/reels-owner-transport.yml
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Test synthetic transport only
        run: |
          node --test ops/owner-serial-transport.test.mjs
          python3 -m unittest discover -s ops -p test_reels_alignment_closed.py -v
      - name: Bind owner transport artifact to six unchanged sources and the reviewed guard override
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/owner-serial-transport
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {join} from 'node:path';
          const reviewedCommit='70090b0a8c26995061ecf3c317b17f58193d1608';
          const paths=[
            'google-v0/scripts/reset-confirmed-failures.mjs',
            'google-v0/lib/reels-confirmed-failure-reset.mjs',
            'google-v0/lib/google-rest.mjs',
            'google-v0/lib/firestore.mjs',
            'google-v0/lib/control-fragments.mjs',
            'google-v0/lib/reels-runtime.mjs',
          ];
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const sources=paths.map(path=>{
            const reviewed=execFileSync('git',['show',reviewedCommit+':'+path]);
            const current=readFileSync(path);
            if(!reviewed.equals(current))throw Error('Reviewed source changed: '+path);
            return {path,sha256:sha(reviewed),bytes:reviewed.length,sourceCommit:reviewedCommit};
          });
          const preloadPath='ops/owner-serial-transport.mjs',preload=readFileSync(preloadPath);
          mkdirSync(join(process.env.ARTIFACT_DIR,'ops'),{recursive:true});
          writeFileSync(join(process.env.ARTIFACT_DIR,preloadPath),preload);
          const guardPath='ops/assert-reels-alignment-closed.py',guard=readFileSync(guardPath),previousGuard=execFileSync('git',['show',reviewedCommit+':'+guardPath]);
          writeFileSync(join(process.env.ARTIFACT_DIR,guardPath),guard);
          const artifactCommit=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const changed=execFileSync('git',['diff','--name-only',reviewedCommit,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const allowed=new Set([preloadPath,'ops/owner-serial-transport.test.mjs',guardPath,'ops/test_reels_alignment_closed.py','.github/workflows/reels-owner-transport.yml']);
          if(changed.some(path=>!allowed.has(path)))throw Error('Transport branch exceeds the five-file scope.');
          const provenance={schemaVersion:2,kind:'owner-serial-transport',reviewedSourceCommit:reviewedCommit,artifactCommit,event:process.env.GITHUB_EVENT_NAME,workflowRun:process.env.GITHUB_RUN_ID,nodeVersion:process.version,sixReviewedSources:sources,preload:{path:preloadPath,sha256:sha(preload),bytes:preload.length,retryAdded:false},guard:{path:guardPath,sha256:sha(guard),bytes:guard.length,reviewedPreviousSHA256:sha(previousGuard),readConcurrency:1,dnsReadRetry:{type:'URLError with pre-response socket.gaierror EAI_AGAIN only',maxTotalAttempts:3,backoffSeconds:2,globalBudgetSeconds:90,httpOrWriteRetry:false}},tests:['ops/owner-serial-transport.test.mjs','ops/test_reels_alignment_closed.py'].map(path=>({path,sha256:sha(readFileSync(path)),result:'passed'})),workflowSHA256:sha(readFileSync('.github/workflows/reels-owner-transport.yml')),network:'synthetic fetch and urllib only; no Google authentication or provider calls',productSourceModified:false};
          writeFileSync(join(process.env.ARTIFACT_DIR,'provenance.json'),JSON.stringify(provenance,null,2)+'\n');
          console.log(JSON.stringify({artifactCommit,nodeVersion:process.version,preloadSHA256:provenance.preload.sha256,guardSHA256:provenance.guard.sha256,reviewedSources:6}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: owner-serial-transport-${{ github.sha }}
          path: ${{ runner.temp }}/owner-serial-transport/
          if-no-files-found: error
          retention-days: 7
