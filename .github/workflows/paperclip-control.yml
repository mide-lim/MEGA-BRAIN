name: Paperclip control CI
on:
  pull_request:
    paths:
      - 'ops/paperclip/**'
      - 'scripts/test_orchestration.py'
      - '.github/workflows/paperclip-control.yml'
  push:
    branches: [main]
    paths:
      - 'ops/paperclip/**'
      - 'scripts/test_orchestration.py'
      - '.github/workflows/paperclip-control.yml'
permissions:
  contents: read
concurrency:
  group: paperclip-control-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pinned-image-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test launcher and task policy without Codex
        run: |
          python3 scripts/test_orchestration.py
          python3 ops/paperclip/test-export-image.py
          python3 ops/paperclip/test-mcp-header-patch.py
      - name: Build fixed upstream with reviewed control overlay
        run: |
          docker build --file ops/paperclip/Dockerfile.single-attempt \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label org.opencontainers.image.source=https://github.com/mide-lim/MEGA-BRAIN \
            --tag paperclip-control-candidate .
      - name: Validate compiled JavaScript
        run: |
          docker run --rm --network none --read-only --entrypoint node paperclip-control-candidate --check /app/server/dist/services/heartbeat.js
          docker run --rm --network none --read-only --entrypoint node paperclip-control-candidate --check /app/server/dist/services/recovery/service.js
      - name: Exercise image scheduling and recovery boundaries with stubs
        run: |
          docker run --rm --network none --read-only --entrypoint node \
            --mount type=bind,src="${{ github.workspace }}/ops/paperclip/test-image-boundaries.cjs",dst=/tmp/test-image-boundaries.cjs,readonly \
            paperclip-control-candidate /tmp/test-image-boundaries.cjs

      - name: Verify bounded skill selection and actual upstream mount without a model
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev --entrypoint node \
            --mount type=bind,src="${{ github.workspace }}/ops/paperclip/test-bounded-profile.mjs",dst=/tmp/test-bounded-profile.mjs,readonly \
            paperclip-control-candidate --import /app/server/node_modules/tsx/dist/loader.mjs /tmp/test-bounded-profile.mjs

      - name: Exercise full server and isolated PostgreSQL without a model
        run: python3 ops/paperclip/test-server-isolated.py --image paperclip-control-candidate

      - name: Export tested image and reviewed controls on main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 ops/paperclip/export-image.py --commit "${{ github.sha }}" --output release
      - name: Upload temporary installation bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paperclip-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
