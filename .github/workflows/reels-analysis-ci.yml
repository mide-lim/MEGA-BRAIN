name: Reels analysis offline CI
on:
  pull_request:
    paths:
      - 'operations/reels-analysis/**'
      - 'operations/reels-analysis-live/**'
      - 'operations/reels-analysis-ci/**'
      - 'operations/reels-identity/**'
      - 'operations/reels-pilot/**'
      - 'docs/SPRINT2E.md'
      - 'docs/reels-identity/**'
      - 'docs/reels-analysis/**'
      - '.github/workflows/reels-analysis-ci.yml'
  push:
    paths:
      - 'operations/reels-analysis/**'
      - 'operations/reels-analysis-live/**'
      - 'operations/reels-analysis-ci/**'
      - 'operations/reels-identity/**'
      - 'operations/reels-pilot/**'
      - 'docs/SPRINT2E.md'
      - 'docs/reels-identity/**'
      - 'docs/reels-analysis/**'
      - '.github/workflows/reels-analysis-ci.yml'
permissions:
  contents: read
  id-token: none
concurrency:
  group: reels-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
          architecture: x64
          check-latest: false
      - name: Install only hash-locked offline validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps --index-url https://pypi.org/simple -r operations/reels-analysis-ci/requirements.offline.lock.txt
          python -m pip check
      - name: Verify public surface and run isolated offline suites without network
        run: |
          PYTHON_BIN="$(command -v python)"
          sudo unshare --net -- "$PYTHON_BIN" operations/reels-analysis-ci/run_ci.py --require-network-namespace
      - name: Check repository documentation and existing bounded packet structure
        run: |
          python scripts/check_links.py
          python scripts/check_task_packets.py
      - name: Verify identity surface and run isolated identity suite offline
        run: |
          PYTHON_BIN="$(command -v python)"
          sudo unshare --net -- "$PYTHON_BIN" - <<'PY'
          import ast, json, os, shutil, sys, tempfile
          from pathlib import Path
          sys.dont_write_bytecode = True
          root = Path.cwd()
          sys.path.insert(0, str(root / "operations/reels-analysis-ci"))
          from run_ci import environment, probe_guard, run_module
          from verify_public import scan_text
          from jsonschema import Draft202012Validator
          assert os.readlink("/proc/self/ns/net") != os.readlink("/proc/1/ns/net")
          allowed = {
              "operations/reels-identity/grant_spec.py",
              "operations/reels-identity/auth_diagnostic.py",
              "operations/reels-identity/contracts/synthetic-grant.v1.schema.json",
              "operations/reels-identity/fixtures/synthetic-grant.v1.json",
              "operations/reels-identity/tests/test_grant_contract.py",
              "operations/reels-identity/tests/test_auth_diagnostic.py",
              "docs/reels-identity/README.md",
          }
          actual = set()
          tests_by_file = {}
          for subtree in ("operations/reels-identity", "docs/reels-identity"):
              assert not (root / subtree).is_symlink(), "identity surface root contains symlink"
              for path in (root / subtree).rglob("*"):
                  assert not path.is_symlink(), "identity surface contains symlink"
                  if not path.is_file():
                      continue
                  name = path.relative_to(root).as_posix()
                  assert name in allowed, "identity surface is not allowlisted: " + name
                  actual.add(name)
                  raw = path.read_bytes()
                  assert len(raw) < 1000000 and b"\0" not in raw
                  text = raw.decode("utf-8")
                  scan_text(name, text)
                  if path.suffix == ".py":
                      tree = ast.parse(text, filename=name)
                      compile(tree, name, "exec")
                      if name.startswith("operations/reels-identity/tests/"):
                          tests_by_file[path.name] = sum(isinstance(n, ast.FunctionDef) and n.name.startswith("test_") for n in ast.walk(tree))
                  elif path.name.endswith(".schema.json"):
                      Draft202012Validator.check_schema(json.loads(text))
                  elif path.suffix == ".json":
                      json.loads(text)
          assert actual == allowed, "identity public surface incomplete"
          assert tests_by_file.get("test_grant_contract.py") == 23
          assert tests_by_file.get("test_auth_diagnostic.py", 0) > 0
          tests = sum(tests_by_file.values())
          with tempfile.TemporaryDirectory(prefix="identity-offline-ci-") as value:
              scratch = Path(value)
              support = scratch / "reels-analysis-live"
              support.mkdir()
              for name in ("cloud_adapter.py", "common.py", "storage.py"):
                  shutil.copy2(root / "operations/reels-analysis-live" / name, support / name)
              env = environment(scratch)
              probes = probe_guard(scratch, env)
              suite = run_module("reels-identity", tests, scratch, env)
          print(json.dumps({"identity_public_files": len(actual), "identity_suite": suite, "identity_tests_by_file": tests_by_file, "guard_probes": probes, "google_calls": 0}, sort_keys=True))
          PY
      - name: Validate signed grants and durable provider chain using synthetic data only
        run: |
          PYTHON_BIN="$(command -v python)"
          sudo unshare --net -- "$PYTHON_BIN" operations/reels-analysis-ci/run_pilot_ci.py
